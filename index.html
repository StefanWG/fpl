<!DOCTYPE html>
<html lang="en">
<head>
    <script src="utils.js" defer></script>
    <script src="standings.js" defer></script>

    <link rel="stylesheet" type="text/css" href="style.css">


</head>
<body>
      <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">FPL Draft</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link active">Standings</a></li>
                <li><a href="matches.html" class="nav-link">Matches</a></li>
            </ul>
            <!-- League Selector Dropdown -->
            <div class="league-selector-container">
                <select id="league-select" onchange="switchLeague(this.value)">
                    <option value="10982">A league of their own</option>
                    <option value="93782">Project 2027</option>
                    <!-- Add your league IDs here -->
                </select>
            </div>
        </div>
    </nav>
    <div class="table-container">
        <table id="standings" class="modern-table" style="width:100%">
            <thead>
                <tr>
                    <th>Team</th>
                    <th title="Total points in your H2H league">Points</th>
                    <th title="Expected points calculated by simulating games between all teams every team every week">xPts</th>
                    <th title="Total matches won">W</th>
                    <th title="Total matches lost">L</th>
                    <th title="Total matches drawn">D</th>
                    <th title="Total goals for (fantasy points scored)">GF</th>
                    <th title="Total goals against (fantasy points conceded)">GA</th>
                    <th title="Total points from automatic substitutions">Sub Pts</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</body>
</html>
